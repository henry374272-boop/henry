<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ascend Capital - 未来智领企业官网</title>
  <style>
    :root {
      --bg: #05070d;
      --panel: rgba(255, 255, 255, 0.04);
      --card: rgba(255, 255, 255, 0.06);
      --text: #e8ecf2;
      --muted: #9ba4b5;
      --accent: #58d6ff;
      --accent-2: #8f7bff;
      --gradient: linear-gradient(135deg, #101828, #0a0d1a 55%, #05070d 100%);
      --radius: 18px;
      --shadow: 0 20px 70px rgba(0, 0, 0, 0.45);
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Inter", "Helvetica Neue", Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.7;
      -webkit-font-smoothing: antialiased;
    }

    a { color: inherit; text-decoration: none; }

    header {
      position: sticky;
      top: 0;
      z-index: 999;
      backdrop-filter: blur(14px);
      background: rgba(5, 7, 13, 0.72);
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
    }

    .nav {
      max-width: 1200px;
      margin: 0 auto;
      padding: 16px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      font-weight: 700;
      letter-spacing: 0.5px;
      color: #f7f9fb;
    }

    .brand-mark {
      width: 40px;
      height: 40px;
      display: grid;
      place-items: center;
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      border-radius: 12px;
      font-weight: 800;
      box-shadow: 0 10px 30px rgba(88, 214, 255, 0.3);
    }

    nav ul {
      display: flex;
      align-items: center;
      gap: 18px;
      margin: 0;
      padding: 0;
      list-style: none;
    }

    nav a {
      padding: 10px 14px;
      border-radius: 12px;
      font-weight: 600;
      color: var(--muted);
      transition: all 0.2s ease;
    }

    nav a:hover, nav a.active {
      color: var(--text);
      background: rgba(255, 255, 255, 0.06);
    }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 12px 18px;
      border-radius: 14px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      background: linear-gradient(135deg, rgba(88, 214, 255, 0.18), rgba(143, 123, 255, 0.18));
      color: #f7f9fb;
      font-weight: 700;
      cursor: pointer;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .btn.secondary {
      background: transparent;
      color: var(--muted);
      border-color: rgba(255, 255, 255, 0.08);
    }

    .btn:hover { transform: translateY(-2px); box-shadow: 0 10px 30px rgba(88, 214, 255, 0.2); }

    .hero {
      background: var(--gradient);
      position: relative;
      overflow: hidden;
      padding: 90px 24px 110px;
    }

    .hero::before, .hero::after {
      content: "";
      position: absolute;
      filter: blur(90px);
      opacity: 0.35;
    }

    .hero::before { width: 280px; height: 280px; background: #58d6ff; left: -60px; top: -40px; }
    .hero::after { width: 320px; height: 320px; background: #8f7bff; right: -80px; bottom: -60px; }

    .hero-grid {
      max-width: 1200px;
      margin: 0 auto;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
      gap: 30px;
      position: relative;
      z-index: 2;
      align-items: center;
    }

    .hero-text h1 {
      font-size: clamp(36px, 5vw, 56px);
      margin: 0 0 12px;
      line-height: 1.1;
      letter-spacing: -0.5px;
    }

    .hero-text p {
      color: var(--muted);
      font-size: 18px;
      margin-bottom: 28px;
      max-width: 560px;
    }

    .chip-row { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 18px; }
    .chip { padding: 8px 12px; border-radius: 999px; border: 1px solid rgba(255,255,255,0.08); background: rgba(255,255,255,0.06); color: var(--muted); font-weight: 600; }

    .hero-visual {
      background: var(--card);
      border-radius: 22px;
      padding: 18px;
      border: 1px solid rgba(255, 255, 255, 0.08);
      box-shadow: var(--shadow);
      position: relative;
      overflow: hidden;
    }

    .hero-visual img {
      width: 100%;
      border-radius: 16px;
      object-fit: cover;
      height: 100%;
      min-height: 260px;
      display: block;
    }

    .tag {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 10px 14px;
      border-radius: 12px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.08);
      color: var(--muted);
      margin-bottom: 14px;
      font-weight: 600;
    }

    section { padding: 90px 24px; position: relative; }
    .section-inner { max-width: 1200px; margin: 0 auto; }

    .section-header { display: flex; justify-content: space-between; align-items: center; gap: 16px; margin-bottom: 28px; flex-wrap: wrap; }
    .section-title { font-size: 28px; margin: 0; }
    .section-desc { color: var(--muted); max-width: 640px; }

    .card-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 20px; }

    .card {
      background: var(--card);
      border: 1px solid rgba(255, 255, 255, 0.06);
      border-radius: var(--radius);
      padding: 20px;
      box-shadow: var(--shadow);
      transition: transform 0.2s ease, border-color 0.2s ease, box-shadow 0.2s ease;
    }

    .card:hover { transform: translateY(-4px); border-color: rgba(88, 214, 255, 0.5); box-shadow: 0 18px 48px rgba(0,0,0,0.45); }

    .card h3 { margin-top: 0; margin-bottom: 8px; }
    .card p { margin: 0; color: var(--muted); }

    .pill { display: inline-block; padding: 6px 10px; border-radius: 10px; background: rgba(88,214,255,0.12); color: #cbeeff; font-weight: 700; font-size: 12px; letter-spacing: 0.4px; }
    .meta { color: var(--muted); font-size: 14px; }

    .about {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
      gap: 24px;
      align-items: center;
    }

    .accent-box {
      padding: 22px;
      border-radius: var(--radius);
      background: linear-gradient(145deg, rgba(88,214,255,0.12), rgba(143,123,255,0.12));
      border: 1px solid rgba(255, 255, 255, 0.08);
    }

    .list { display: grid; gap: 12px; margin: 0; padding-left: 18px; color: var(--muted); }

    .logo-wall {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
      gap: 16px;
      align-items: center;
    }

    .logo-wall img { width: 100%; height: 64px; object-fit: contain; filter: grayscale(1) contrast(1.1); opacity: 0.85; background: rgba(255,255,255,0.02); border-radius: 12px; padding: 12px; }

    .cases { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 20px; }

    .case-card {
      position: relative;
      overflow: hidden;
    }

    .case-card .badge { position: absolute; top: 16px; right: 16px; }
    .case-card strong { display: block; margin-bottom: 6px; font-size: 18px; }

    .team-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 18px; }

    .team-card img { width: 100%; height: 220px; object-fit: cover; border-radius: 14px; margin-bottom: 12px; }
    .team-card .role { color: var(--muted); font-weight: 600; margin-bottom: 6px; }

    .contact {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 20px;
      align-items: center;
    }

    .contact-card { display: grid; gap: 12px; }
    .contact-card a { color: var(--accent); }

    footer {
      padding: 40px 24px 60px;
      background: #04050a;
      color: var(--muted);
      border-top: 1px solid rgba(255, 255, 255, 0.06);
    }

    .footer-inner { max-width: 1200px; margin: 0 auto; display: flex; flex-direction: column; gap: 14px; }
    .footer-top { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 14px; }

    .divider { height: 1px; background: rgba(255, 255, 255, 0.06); margin: 12px 0; }

    @media (max-width: 768px) {
      nav ul { display: none; }
      .hero { padding-top: 64px; }
      .nav { padding: 12px 16px; }
      .hero-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>

  <script>
    const qs = (selector) => document.querySelector(selector);

    function render() {
      const { branding, nav, hero, about, services, cases, team, contact, footer } = CONTENT;

      qs('#brand-name').textContent = branding.company;
      qs('#brand-tagline').textContent = branding.tagline;
      qs('#footer-name').textContent = branding.company;
      qs('#footer-tagline').textContent = branding.tagline;

      const navList = qs('#navLinks');
      nav.forEach(item => {
        const li = document.createElement('li');
        const a = document.createElement('a');
        a.textContent = item.label;
        a.href = item.link;
        li.appendChild(a);
        navList.appendChild(li);
      });

      qs('#navCTA').href = contact ? '#contact' : '#';

      qs('#hero-tag').textContent = branding.tagline;
      qs('#hero-title').textContent = hero.title;
      qs('#hero-subtitle').textContent = hero.subtitle;
      qs('#hero-image').src = hero.heroImage;
      qs('#hero-primary').textContent = hero.primaryCTA.label;
      qs('#hero-primary').href = hero.primaryCTA.link;
      qs('#hero-secondary').textContent = hero.secondaryCTA.label;
      qs('#hero-secondary').href = hero.secondaryCTA.link;
      const chipBox = qs('#hero-chips');
      hero.chips.forEach(text => {
        const span = document.createElement('span');
        span.className = 'chip';
        span.textContent = text;
        chipBox.appendChild(span);
      });

      qs('#about-title').textContent = about.title;
      qs('#about-intro').textContent = about.intro;
      qs('#about-image').src = about.heroImage;
      const list = qs('#about-highlights');
      about.highlights.forEach(text => {
        const li = document.createElement('li');
        li.textContent = text;
        list.appendChild(li);
      });
      const statsWrap = qs('#about-stats');
      about.stats.forEach(stat => {
        const card = document.createElement('div');
        card.className = 'card';
        card.innerHTML = `<h3>${stat.value}</h3><p class="meta">${stat.label}</p>`;
        statsWrap.appendChild(card);
      });

      qs('#services-title').textContent = services.title;
      qs('#services-desc').textContent = services.desc;
      const serviceGrid = qs('#services-grid');
      services.items.forEach(item => {
        const card = document.createElement('div');
        card.className = 'card';
        card.innerHTML = `
          <span class="pill">${item.badge}</span>
          <h3>${item.name}</h3>
          <p>${item.detail}</p>
        `;
        serviceGrid.appendChild(card);
      });

      qs('#cases-title').textContent = cases.title;
      qs('#cases-desc').textContent = cases.desc;
      const caseGrid = qs('#cases-grid');
      cases.projects.forEach(project => {
        const card = document.createElement('div');
        card.className = 'card case-card';
        card.innerHTML = `
          <span class="pill badge">${project.badge}</span>
          <strong>${project.title}</strong>
          <p>${project.summary}</p>
        `;
        caseGrid.appendChild(card);
      });
      const logoWall = qs('#logo-wall');
      cases.logos.forEach(src => {
        const img = document.createElement('img');
        img.src = src;
        img.alt = 'Client logo placeholder';
        logoWall.appendChild(img);
      });

      qs('#team-title').textContent = team.title;
      qs('#team-desc').textContent = team.desc;
      const teamGrid = qs('#team-grid');
      team.members.forEach(member => {
        const card = document.createElement('div');
        card.className = 'card team-card';
        card.innerHTML = `
          <img src="${member.avatar}" alt="${member.name}" />
          <strong>${member.name}</strong>
          <div class="role">${member.role}</div>
          <p>${member.bio}</p>
        `;
        teamGrid.appendChild(card);
      });

      qs('#contact-title').textContent = contact.title;
      qs('#contact-desc').textContent = contact.desc;
      qs('#contact-email').textContent = contact.email;
      qs('#contact-email').href = `mailto:${contact.email}`;
      qs('#contact-phone').textContent = contact.phone;
      qs('#contact-phone').href = `tel:${contact.phone}`;
      qs('#contact-address').textContent = contact.address;
      qs('#contact-cta').textContent = contact.cta;

      const footerLinks = qs('#footer-links');
      footer.links.forEach(link => {
        const a = document.createElement('a');
        a.href = link.link;
        a.textContent = link.label;
        footerLinks.appendChild(a);
      });
      qs('#footer-copy').textContent = footer.copy;
    }

    function handleScrollSpy() {
      const sections = document.querySelectorAll('main section');
      const links = document.querySelectorAll('#navLinks a');
      const observer = new IntersectionObserver(entries => {
        entries.forEach(entry => {
          if (entry.isIntersecting) {
            links.forEach(link => {
              link.classList.toggle('active', link.getAttribute('href') === `#${entry.target.id}`);
            });
          }
        });
      }, { threshold: 0.3 });
      sections.forEach(section => observer.observe(section));
    }

    function addRevealEffects() {
      const revealItems = document.querySelectorAll('.card, .hero-text, .hero-visual, .accent-box');
      const observer = new IntersectionObserver(entries => {
        entries.forEach(entry => {
          if (entry.isIntersecting) {
            entry.target.style.transition = 'transform 0.6s ease, opacity 0.6s ease';
            entry.target.style.transform = 'translateY(0)';
            entry.target.style.opacity = '1';
          }
        });
      }, { threshold: 0.2 });
      revealItems.forEach(item => {
        item.style.transform = 'translateY(20px)';
        item.style.opacity = '0';
        observer.observe(item);
      });
    }

    document.addEventListener('DOMContentLoaded', () => {
      render();
      handleScrollSpy();
      addRevealEffects();
    });
  </script>
</body>
</html>
